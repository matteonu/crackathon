services:
  app:
    build: .
    ports:
      - "8080:8080"
    env_file:
      # A fresh clone can start without one; the VM's .env holds SECRET_KEY and the model key.
      - path: .env
        required: false
    # The database, uploaded PDFs and generated results live here. Without this bind
    # mount, `docker compose up -d --build` would throw away everything users added.
    volumes:
      - ./data:/app/data
    restart: unless-stopped
