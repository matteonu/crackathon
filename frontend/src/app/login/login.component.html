<div class="flex min-h-screen items-center justify-center p-4">
  <z-card class="w-full max-w-sm">
    <z-card-header>
      <z-card-title zTitle="Log in" />
      <z-card-description zDescription="Sign in to see your study dashboard." />
    </z-card-header>
    <z-card-content>
      <form class="flex flex-col gap-4" (ngSubmit)="submit()">
        <div class="grid gap-2">
          <label for="username" class="text-sm font-medium">Username</label>
          <input z-input id="username" name="username" [(ngModel)]="username" autocomplete="username" required />
        </div>
        <div class="grid gap-2">
          <label for="password" class="text-sm font-medium">Password</label>
          <input
            z-input
            id="password"
            name="password"
            type="password"
            [(ngModel)]="password"
            autocomplete="current-password"
            required
          />
        </div>
        @if (error) {
          <z-alert zType="destructive" zTitle="Login failed" [zDescription]="error" />
        }
        <button z-button type="submit" class="w-full" [disabled]="loading">Log in</button>
      </form>
    </z-card-content>
  </z-card>
</div>
